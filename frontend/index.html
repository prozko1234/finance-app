         is what makes env(safe-area-inset-*) report anything but zero. maximum-scale stops
         iOS from zooming the whole layout when a text field is focused. -->

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
